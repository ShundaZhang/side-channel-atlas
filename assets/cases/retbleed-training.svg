<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title"><title id="title">Retbleed: the real stack and prediction are separate</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="960" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="52" font-size="30" fill="#17263d" font-weight="700">Retbleed: the real stack and prediction are separate</text><text x="40" y="87" font-size="19" fill="#53677d">S = training branch; T = victim RET; G = gadget; R_OK = real saved return</text><rect x="40" y="116" width="570" height="140" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="149" font-size="21" fill="#2459bf" font-weight="700">Architectural path</text><text x="60" y="194" font-size="19" fill="#17263d">CALL saves R_OK in software stack. T: RET must</text><text x="60" y="221" font-size="19" fill="#17263d">return to R_OK.</text><rect x="670" y="116" width="570" height="140" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="690" y="149" font-size="21" fill="#2459bf" font-weight="700">Normal prediction path</text><text x="690" y="194" font-size="19" fill="#17263d">CALL tracks R_OK in RSB. RET predicts from it</text><text x="690" y="221" font-size="19" fill="#17263d">before the stack target is ready.</text><rect x="40" y="294" width="570" height="155" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="60" y="327" font-size="21" fill="#b65314" font-weight="700">Intel path in the original evaluation</text><text x="60" y="372" font-size="19" fill="#17263d">No usable RSB prediction → alternate</text><text x="60" y="399" font-size="19" fill="#17263d">indirect-target prediction. Software R_OK is</text><text x="60" y="426" font-size="19" fill="#17263d">still present.</text><rect x="670" y="294" width="570" height="155" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="690" y="327" font-size="21" fill="#b65314" font-weight="700">AMD Zen 1/2 evaluated path</text><text x="690" y="372" font-size="19" fill="#17263d">Colliding indirect branch → type confusion at</text><text x="690" y="399" font-size="19" fill="#17263d">RET. RAS need not be empty.</text><rect x="40" y="490" width="350" height="165" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="60" y="523" font-size="21" fill="#b65314" font-weight="700">Train target state: S → G</text><text x="60" y="568" font-size="19" fill="#17263d">Execute branches, not</text><text x="60" y="595" font-size="19" fill="#17263d">secret bytes. Relevant</text><text x="60" y="622" font-size="19" fill="#17263d">predictor aliasing with T</text><text x="60" y="649" font-size="19" fill="#17263d">is required.</text><rect x="465" y="490" width="350" height="165" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="485" y="523" font-size="21" fill="#b65314" font-weight="700">T: RET predicts G</text><text x="485" y="568" font-size="19" fill="#17263d">Affected path + trained</text><text x="485" y="595" font-size="19" fill="#17263d">state → transiently fetch</text><text x="485" y="622" font-size="19" fill="#17263d">code at G.</text><rect x="890" y="490" width="350" height="165" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="910" y="523" font-size="21" fill="#2459bf" font-weight="700">Resolve: return R_OK</text><text x="910" y="568" font-size="19" fill="#17263d">Squash G. A useful gadget</text><text x="910" y="595" font-size="19" fill="#17263d">may already have left a</text><text x="910" y="622" font-size="19" fill="#17263d">data-dependent trace.</text><path d="M325 449V469H550V480" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M955 449V469H740V480" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M390 574H452" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M815 574H877" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><rect x="40" y="697" width="1200" height="208" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="730" font-size="21" fill="#2459bf" font-weight="700">Read the two stacks independently</text><text x="60" y="775" font-size="19" fill="#17263d">Software: CALL f; CALL g; RET → R_f; RET → R_main. RSB: predicts those returns only while useful</text><text x="60" y="802" font-size="19" fill="#17263d">entries exist. Underflow is a prediction shortage, not a software-stack memory error. No fixed RSB</text><text x="60" y="829" font-size="19" fill="#17263d">capacity is assumed. RSB is not CET shadow stack.</text></g></svg>