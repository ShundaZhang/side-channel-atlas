<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Spectre V2 · conceptual flow</title><desc id="desc">The real function pointer stays intact; the CPU may temporarily fetch instructions from a different predicted target.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1000" height="490" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="28" y="39" font-size="24" fill="#17263d" font-weight="700">Spectre V2</text><text x="28" y="76" font-size="17" fill="#2459bf">Solid blue = architectural outcome</text><text x="500" y="76" font-size="17" fill="#b65314">Dashed orange = affected transient behavior</text><rect x="28" y="125" width="260" height="195" rx="14" fill="#f0f4f9"/><text x="47" y="158" font-size="18" fill="#53677d" font-weight="700">Trigger / event</text><text x="47" y="198" font-size="20" fill="#17263d">Indirect target not</text><text x="47" y="225" font-size="20" fill="#17263d">ready</text><rect x="390" y="110" width="580" height="112" rx="14" fill="#e9f0ff"/><text x="410" y="142" font-size="18" fill="#2459bf" font-weight="700">Architectural result</text><text x="410" y="179" font-size="20" fill="#2459bf">Branch to NORMAL</text><rect x="390" y="275" width="580" height="112" rx="14" fill="#fff0e4"/><text x="410" y="307" font-size="18" fill="#b65314" font-weight="700">Affected transient path</text><text x="410" y="344" font-size="20" fill="#b65314">Execute GADGET first</text><path d="M288 210H332V166H380" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M288 210H332V331H380" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><rect x="28" y="346" width="260" height="125" rx="14" fill="#f0f4f9"/><text x="47" y="375" font-size="16" fill="#53677d" font-weight="700">Value / prediction source</text><text x="47" y="407" font-size="18" fill="#17263d">Victim code at</text><text x="47" y="434" font-size="18" fill="#17263d">predicted gadget</text><text x="390" y="429" font-size="18" fill="#53677d">No wrong-path result is committed; a trace may</text><text x="390" y="456" font-size="18" fill="#53677d">remain.</text></g></svg>