<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title"><title id="title">Retbleed：真实软件栈与预测状态是两条路径</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="960" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="52" font-size="30" fill="#17263d" font-weight="700">Retbleed：真实软件栈与预测状态是两条路径</text><text x="40" y="87" font-size="19" fill="#53677d">S = 训练分支；T = 受害者 RET；G = gadget；R_OK = 真实返回地址</text><rect x="40" y="116" width="570" height="140" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="149" font-size="21" fill="#2459bf" font-weight="700">架构路径</text><text x="60" y="194" font-size="19" fill="#17263d">CALL 把 R_OK 保存在软件栈。T: RET 最终必须返回</text><text x="60" y="221" font-size="19" fill="#17263d">R_OK。</text><rect x="670" y="116" width="570" height="140" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="690" y="149" font-size="21" fill="#2459bf" font-weight="700">正常预测路径</text><text x="690" y="194" font-size="19" fill="#17263d">CALL 在 RSB 跟踪 R_OK；RET</text><text x="690" y="221" font-size="19" fill="#17263d">在栈目标就绪前借它提前预测。</text><rect x="40" y="294" width="570" height="155" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="60" y="327" font-size="21" fill="#b65314" font-weight="700">原评估的 Intel 路径</text><text x="60" y="372" font-size="19" fill="#17263d">无可用 RSB 预测 →</text><text x="60" y="399" font-size="19" fill="#17263d">使用间接目标的替代预测路径；软件栈中的 R_OK 仍然存在。</text><rect x="670" y="294" width="570" height="155" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="690" y="327" font-size="21" fill="#b65314" font-weight="700">原评估的 AMD Zen 1 / 2 路径</text><text x="690" y="372" font-size="19" fill="#17263d">碰撞的间接分支 → RET 处发生类型混淆；不要求 RAS</text><text x="690" y="399" font-size="19" fill="#17263d">先变空。</text><rect x="40" y="490" width="350" height="165" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="60" y="523" font-size="21" fill="#b65314" font-weight="700">训练目标状态：S → G</text><text x="60" y="568" font-size="19" fill="#17263d">执行的是分支，不是秘密字节；需要</text><text x="60" y="595" font-size="19" fill="#17263d">与 T 在相关预测状态中别名。</text><rect x="465" y="490" width="350" height="165" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="485" y="523" font-size="21" fill="#b65314" font-weight="700">T: RET 先预测到 G</text><text x="485" y="568" font-size="19" fill="#17263d">受影响预测路径 + 已训练状态 →</text><text x="485" y="595" font-size="19" fill="#17263d">从 G 瞬态取指。</text><rect x="890" y="490" width="350" height="165" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="910" y="523" font-size="21" fill="#2459bf" font-weight="700">解析后：返回 R_OK</text><text x="910" y="568" font-size="19" fill="#17263d">取消 G 路径；有用 gadget</text><text x="910" y="595" font-size="19" fill="#17263d">可能已经留下数据相关痕迹。</text><path d="M325 449V469H550V480" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M955 449V469H740V480" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M390 574H452" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><path d="M815 574H877" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><rect x="40" y="697" width="1200" height="208" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="730" font-size="21" fill="#2459bf" font-weight="700">把两种栈分开阅读</text><text x="60" y="775" font-size="19" fill="#17263d">软件栈：CALL f；CALL g；RET → R_f；RET →</text><text x="60" y="802" font-size="19" fill="#17263d">R_main。RSB：有可用项时提前预测这些返回。下溢是预测项不足，不是软件栈内存错误。不假设固定 RSB 容量；RSB 也不是 CET</text><text x="60" y="829" font-size="19" fill="#17263d">shadow stack。</text></g></svg>