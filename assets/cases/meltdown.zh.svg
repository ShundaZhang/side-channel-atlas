<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Meltdown V3 · 概念流程</title><desc id="desc">读取仍会故障，但受影响硬件可能已把受保护字节交给后续瞬态依赖指令。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1000" height="490" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="28" y="39" font-size="24" fill="#17263d" font-weight="700">Meltdown V3</text><text x="28" y="76" font-size="17" fill="#2459bf">蓝色实线 = 正式结果</text><text x="500" y="76" font-size="17" fill="#b65314">橙色虚线 = 受影响的瞬态行为</text><rect x="28" y="125" width="260" height="195" rx="14" fill="#f0f4f9"/><text x="47" y="158" font-size="18" fill="#53677d" font-weight="700">触发 / 事件</text><text x="47" y="198" font-size="20" fill="#17263d">读取缺少用户态权限</text><rect x="390" y="110" width="580" height="112" rx="14" fill="#e9f0ff"/><text x="410" y="142" font-size="18" fill="#2459bf" font-weight="700">正式结果</text><text x="410" y="179" font-size="20" fill="#2459bf">权限页故障，不提交该字节</text><rect x="390" y="275" width="580" height="112" rx="14" fill="#fff0e4"/><text x="410" y="307" font-size="18" fill="#b65314" font-weight="700">受影响的瞬态路径</text><text x="410" y="344" font-size="20" fill="#b65314">依赖操作短暂使用该字节</text><path d="M288 210H332V166H380" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M288 210H332V331H380" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><rect x="28" y="346" width="260" height="125" rx="14" fill="#f0f4f9"/><text x="47" y="375" font-size="16" fill="#53677d" font-weight="700">值 / 预测的来源</text><text x="47" y="407" font-size="18" fill="#17263d">受保护映射中的数据</text><text x="390" y="429" font-size="18" fill="#53677d">错误路径结果不提交，但可能留下痕迹。</text></g></svg>