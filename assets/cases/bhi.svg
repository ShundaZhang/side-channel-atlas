<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">BHI / annotated code walkthrough</title><desc id="desc">Changing branch-history context can change which learned target is predicted, without changing the real target. Semantic pseudocode / not an executable PoC kernel_seed: indirect_branch_to(G) Learn eligible in-domain target state user: execute_branch_sequence(H_G) Shape history; not a writable BHB API victim J: call fp  // fp = NORMAL Real operand is still NORMAL predict(J, H_G, mode, learned_state) = G Matching history may select learned G transient: G uses victim data Gadget must create an observable effect resolve: execute NORMAL; discard G Not a pointer overwrite or a new target</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">MECHANISM / CODE WALKTHROUGH</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">BHI</text><text x="40" y="116" font-size="21" fill="#53677d">Changing branch-history context can change which learned target is predicted, without changing</text><text x="40" y="142" font-size="21" fill="#53677d">the real target.</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">What starts it?</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">Correct outcome vs affected behavior</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">Source of data / prediction</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">History-sensitive</text><text x="73" y="289" font-size="22" fill="#17263d" font-weight="700">indirect prediction</text><text x="73" y="362" font-size="18" fill="#53677d">Seed target state</text><text x="73" y="387" font-size="18" fill="#53677d">in-domain; shape</text><text x="73" y="412" font-size="18" fill="#53677d">history before victim</text><text x="73" y="437" font-size="18" fill="#53677d">J.</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">Architectural outcome</text><text x="456" y="288" font-size="21" fill="#2459bf">Resolve and execute NORMAL</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">Affected transient behavior</text><text x="456" y="424" font-size="21" fill="#b65314">A history-selected wrong gadget</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="246" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="270" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Seed: branch -&gt; G</text><rect x="985" y="293" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="317" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">History: H_G</text><rect x="985" y="340" width="228" height="36" rx="14" fill="#fff1e6" stroke="none" /><text x="997" y="364" font-size="16" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">J: actual NORMAL</text><text x="986" y="417" font-size="17" fill="#53677d">History selects; fp is</text><text x="986" y="439" font-size="17" fill="#53677d">unchanged</text><rect x="30" y="528" width="1220" height="411" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="561" font-size="20" fill="#2459bf" font-weight="700">KEY CODE / Follow the highlighted line through the diagram</text><text x="55" y="590" font-size="17" fill="#53677d">Semantic pseudocode / not an executable PoC</text><rect x="54" y="606" width="1172" height="280" rx="14" fill="#f4f7fb" stroke="none" /><path d="M755 618V875" stroke="#d5deeb"/><text x="73" y="638" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">01</text><text x="115" y="638" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">kernel_seed: indirect_branch_to(G)</text><text x="775" y="633" font-size="18" fill="#53677d">Learn eligible in-domain target state</text><rect x="61" y="660" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="684" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">02</text><text x="115" y="684" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">user: execute_branch_sequence(H_G)</text><text x="775" y="679" font-size="18" fill="#b65314" font-weight="700">Shape history; not a writable BHB API</text><text x="73" y="730" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">03</text><text x="115" y="730" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">victim J: call fp  // fp = NORMAL</text><text x="775" y="725" font-size="18" fill="#53677d">Real operand is still NORMAL</text><rect x="61" y="752" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="776" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">04</text><text x="115" y="776" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">predict(J, H_G, mode, learned_state) = G</text><text x="775" y="771" font-size="18" fill="#b65314" font-weight="700">Matching history may select learned G</text><text x="73" y="822" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">05</text><text x="115" y="822" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transient: G uses victim data</text><text x="775" y="817" font-size="18" fill="#53677d">Gadget must create an observable effect</text><text x="73" y="868" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">06</text><text x="115" y="868" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">resolve: execute NORMAL; discard G</text><text x="775" y="863" font-size="18" fill="#53677d">Not a pointer overwrite or a new target</text><text x="55" y="910" font-size="17" fill="#53677d">Fragment only: setup, trigger machinery and receiver are omitted; not a hardware reproduction.</text><text x="55" y="931" font-size="14" fill="#53677d">Semantic model: labels / values are illustrative, not real internal APIs.</text><path d="M40 971H78" stroke="#2459bf" stroke-width="3"/><text x="91" y="977" font-size="17" fill="#53677d">Correct semantics</text><path d="M310 971H348" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="977" font-size="17" fill="#53677d">Affected path</text><text x="650" y="977" font-size="17" fill="#53677d">Transient result discarded; a trace may remain</text></g></svg>