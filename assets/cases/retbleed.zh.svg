<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">Retbleed / 代码图解</title><desc id="desc">即使保存的正式返回地址未被改写，RET 仍可能短暂走向错误预测目标。 语义伪代码 / 不是可执行 PoC train: branch_at(S) -&gt; G 需要在相关预测状态中与 T 别名 condition: RSB shortage OR type confusion Intel / AMD 原评估路径不同 victim: saved_stack_target = R_OK 软件栈保存真实返回地址 T: RET  // affected prediction -&gt; G RSB 不是正式软件栈 transient: execute G gadget 可能留下数据相关痕迹 resolve: return_to(R_OK) 没有覆盖保存的真实返回地址</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">机制 / 代码图解</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">Retbleed</text><text x="40" y="116" font-size="21" fill="#53677d">即使保存的正式返回地址未被改写，RET 仍可能短暂走向错误预测目标。</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">从什么事件开始？</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">正确结果与受影响行为</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">数据 / 预测从哪里来</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">RET</text><text x="73" y="289" font-size="22" fill="#17263d" font-weight="700">处于受影响预测条件</text><text x="73" y="362" font-size="18" fill="#53677d">RSB</text><text x="73" y="387" font-size="18" fill="#53677d">提供提前的返回预测；软件栈</text><text x="73" y="412" font-size="18" fill="#53677d">仍保留 R_OK。</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">正式结果</text><text x="456" y="288" font-size="21" fill="#2459bf">正式返回保存的 R_OK</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">受影响的瞬态行为</text><text x="456" y="424" font-size="21" fill="#b65314">短暂执行 G</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="246" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="270" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Train S -&gt; G</text><rect x="985" y="293" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="317" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Victim T: RET</text><rect x="985" y="340" width="228" height="36" rx="14" fill="#fff1e6" stroke="none" /><text x="997" y="364" font-size="16" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Stack: R_OK</text><text x="986" y="417" font-size="17" fill="#53677d">Intel / AMD</text><text x="986" y="439" font-size="17" fill="#53677d">的受影响条件不同</text><rect x="30" y="528" width="1220" height="411" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="561" font-size="20" fill="#2459bf" font-weight="700">主要代码 / 对照上图，跟踪高亮行的行为</text><text x="55" y="590" font-size="17" fill="#53677d">语义伪代码 / 不是可执行 PoC</text><rect x="54" y="606" width="1172" height="280" rx="14" fill="#f4f7fb" stroke="none" /><path d="M755 618V875" stroke="#d5deeb"/><text x="73" y="638" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">01</text><text x="115" y="638" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">train: branch_at(S) -&gt; G</text><text x="775" y="633" font-size="18" fill="#53677d">需要在相关预测状态中与 T 别名</text><rect x="61" y="660" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="684" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">02</text><text x="115" y="684" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">condition: RSB shortage OR type confusion</text><text x="775" y="679" font-size="18" fill="#b65314" font-weight="700">Intel / AMD 原评估路径不同</text><text x="73" y="730" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">03</text><text x="115" y="730" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">victim: saved_stack_target = R_OK</text><text x="775" y="725" font-size="18" fill="#53677d">软件栈保存真实返回地址</text><rect x="61" y="752" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="776" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">04</text><text x="115" y="776" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">T: RET  // affected prediction -&gt; G</text><text x="775" y="771" font-size="18" fill="#b65314" font-weight="700">RSB 不是正式软件栈</text><text x="73" y="822" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">05</text><text x="115" y="822" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transient: execute G</text><text x="775" y="817" font-size="18" fill="#53677d">gadget 可能留下数据相关痕迹</text><text x="73" y="868" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">06</text><text x="115" y="868" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">resolve: return_to(R_OK)</text><text x="775" y="863" font-size="18" fill="#53677d">没有覆盖保存的真实返回地址</text><text x="55" y="910" font-size="17" fill="#53677d">仅保留关键片段：省略环境、触发机制和接收端；不代表已在硬件上复现。</text><text x="55" y="931" font-size="14" fill="#53677d">语义模型：标签 / 数值用于讲解，不代表真实内部 API。</text><path d="M40 971H78" stroke="#2459bf" stroke-width="3"/><text x="91" y="977" font-size="17" fill="#53677d">正确语义</text><path d="M310 971H348" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="977" font-size="17" fill="#53677d">受影响路径</text><text x="650" y="977" font-size="17" fill="#53677d">瞬态结果被取消，但痕迹可能保留</text></g></svg>