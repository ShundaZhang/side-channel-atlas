<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">Foreshadow / L1 Terminal Fault / 代码图解</title><desc id="desc">地址翻译失败，但与无效页表项相关的数据可能仍从 L1D 被瞬态提供。 语义伪代码 / 不是可执行 PoC request = LOAD(V) 请求的是地址，不是缓存索引 translate(V) = INVALID 发生终止性地址翻译故障 relevant_L1D_line = 0x2A 教学设定的驻留字节 transient: t = 0x2A; dependent_use(t) 翻译失败后仍发生受影响的转发 architectural: page_fault() 不提交有效翻译或该读取值 control: evicted line =&gt; source absent 不能由此推导为任意 DRAM 读取</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">机制 / 代码图解</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">Foreshadow / L1 Terminal Fault</text><text x="40" y="116" font-size="21" fill="#53677d">地址翻译失败，但与无效页表项相关的数据可能仍从 L1D 被瞬态提供。</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">从什么事件开始？</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">正确结果与受影响行为</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">数据 / 预测从哪里来</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">终止性地址翻译故障</text><text x="73" y="362" font-size="18" fill="#53677d">地址翻译无效；相关缓存行已</text><text x="73" y="387" font-size="18" fill="#53677d">驻留 L1D。</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">正式结果</text><text x="456" y="288" font-size="21" fill="#2459bf">页故障，没有有效翻译</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">受影响的瞬态行为</text><text x="456" y="424" font-size="21" fill="#b65314">失败后仍可能转发 L1D 值</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="246" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="270" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">LOAD(V)</text><rect x="985" y="293" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="317" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">INVALID PTE</text><rect x="985" y="340" width="228" height="36" rx="14" fill="#fff1e6" stroke="none" /><text x="997" y="364" font-size="16" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">L1D: 0x2A</text><text x="986" y="417" font-size="17" fill="#53677d">不驻留 L1D 则缺少这条来源</text><rect x="30" y="528" width="1220" height="411" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="561" font-size="20" fill="#2459bf" font-weight="700">主要代码 / 对照上图，跟踪高亮行的行为</text><text x="55" y="590" font-size="17" fill="#53677d">语义伪代码 / 不是可执行 PoC</text><rect x="54" y="606" width="1172" height="280" rx="14" fill="#f4f7fb" stroke="none" /><path d="M755 618V875" stroke="#d5deeb"/><text x="73" y="638" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">01</text><text x="115" y="638" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">request = LOAD(V)</text><text x="775" y="633" font-size="18" fill="#53677d">请求的是地址，不是缓存索引</text><rect x="61" y="660" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="684" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">02</text><text x="115" y="684" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">translate(V) = INVALID</text><text x="775" y="679" font-size="18" fill="#b65314" font-weight="700">发生终止性地址翻译故障</text><text x="73" y="730" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">03</text><text x="115" y="730" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">relevant_L1D_line = 0x2A</text><text x="775" y="725" font-size="18" fill="#53677d">教学设定的驻留字节</text><rect x="61" y="752" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="776" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">04</text><text x="115" y="776" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transient: t = 0x2A; dependent_use(t)</text><text x="775" y="771" font-size="18" fill="#b65314" font-weight="700">翻译失败后仍发生受影响的转发</text><text x="73" y="822" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">05</text><text x="115" y="822" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">architectural: page_fault()</text><text x="775" y="817" font-size="18" fill="#53677d">不提交有效翻译或该读取值</text><text x="73" y="868" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">06</text><text x="115" y="868" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">control: evicted line =&gt; source absent</text><text x="775" y="863" font-size="18" fill="#53677d">不能由此推导为任意 DRAM 读取</text><text x="55" y="910" font-size="17" fill="#53677d">仅保留关键片段：省略环境、触发机制和接收端；不代表已在硬件上复现。</text><text x="55" y="931" font-size="14" fill="#53677d">语义模型：标签 / 数值用于讲解，不代表真实内部 API。</text><path d="M40 971H78" stroke="#2459bf" stroke-width="3"/><text x="91" y="977" font-size="17" fill="#53677d">正确语义</text><path d="M310 971H348" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="977" font-size="17" fill="#53677d">受影响路径</text><text x="650" y="977" font-size="17" fill="#53677d">瞬态结果被取消，但痕迹可能保留</text></g></svg>