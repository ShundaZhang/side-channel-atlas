<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title"><title id="title">BHI: target training and history shaping are different phases</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="960" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="52" font-size="30" fill="#17263d" font-weight="700">BHI: target training and history shaping are different phases</text><text x="40" y="87" font-size="19" fill="#53677d">Logical predictor model; not a universal hardware table layout or a runnable PoC</text><rect x="40" y="116" width="560" height="164" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="149" font-size="21" fill="#2459bf" font-weight="700">Victim-domain preparation</text><text x="60" y="194" font-size="19" fill="#17263d">A seed branch executes toward G in the</text><text x="60" y="221" font-size="19" fill="#17263d">relevant domain → useful target state is</text><text x="60" y="248" font-size="19" fill="#17263d">learned. G is not an arbitrary new user-mode</text><text x="60" y="275" font-size="19" fill="#17263d">target.</text><rect x="680" y="116" width="560" height="164" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="700" y="149" font-size="21" fill="#b65314" font-weight="700">User-side history preparation</text><text x="700" y="194" font-size="19" fill="#17263d">Execute a chosen sequence of branches →</text><text x="700" y="221" font-size="19" fill="#17263d">history H. The input is control flow, not</text><text x="700" y="248" font-size="19" fill="#17263d">secret data or a new function pointer.</text><path d="M320 280V343H420V385" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M960 280V343H860V385" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><text x="760" y="326" font-size="16" fill="#b65314">domain transition; history may influence selection</text><rect x="190" y="397" width="900" height="155" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="210" y="430" font-size="21" fill="#2459bf" font-weight="700">Victim indirect branch J: call fp</text><text x="210" y="475" font-size="19" fill="#17263d">fp = handlers[id] = NORMAL. Conceptually: predicted = Predict(J, H, mode,</text><text x="210" y="502" font-size="19" fill="#17263d">learned_state). History affects selection; fp stays NORMAL.</text><path d="M420 552V594H320V625" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M860 552V594H960V625" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><rect x="40" y="637" width="560" height="145" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="670" font-size="21" fill="#2459bf" font-weight="700">Control history H_A → predict NORMAL</text><text x="60" y="715" font-size="19" fill="#17263d">Keep J, fp and target state fixed. Correct</text><text x="60" y="742" font-size="19" fill="#17263d">target is predicted.</text><rect x="680" y="637" width="560" height="145" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="700" y="670" font-size="21" fill="#b65314" font-weight="700">Matching history H_G → predict G</text><text x="700" y="715" font-size="19" fill="#17263d">An eligible learned G entry may be selected.</text><text x="700" y="742" font-size="19" fill="#17263d">Execute G transiently; later recover to</text><text x="700" y="769" font-size="19" fill="#17263d">NORMAL.</text><text x="40" y="826" font-size="21" fill="#17263d" font-weight="700">Candidates ≠ if conditions. History ≠ fp. eIBRS target-mode isolation ≠ history isolation.</text><text x="40" y="866" font-size="19" fill="#53677d">H_A / H_G are labels, not writable BHB bit strings. Real matching depends on CPU-specific context and</text><text x="40" y="893" font-size="19" fill="#53677d">intervening branches. A disclosure gadget and observation channel are still necessary.</text></g></svg>