<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title"><title id="title">BHI：目标关联训练与历史构造是两个不同阶段</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="960" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="52" font-size="30" fill="#17263d" font-weight="700">BHI：目标关联训练与历史构造是两个不同阶段</text><text x="40" y="87" font-size="19" fill="#53677d">逻辑预测模型；不代表通用硬件表布局，也不是可运行 PoC</text><rect x="40" y="116" width="560" height="164" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="149" font-size="21" fill="#2459bf" font-weight="700">受害者预测域内的准备</text><text x="60" y="194" font-size="19" fill="#17263d">同域训练分支执行到 G → 学习有用目标关联。G</text><text x="60" y="221" font-size="19" fill="#17263d">不是凭空新增的任意用户态目标。</text><rect x="680" y="116" width="560" height="164" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="700" y="149" font-size="21" fill="#b65314" font-weight="700">用户侧的历史准备</text><text x="700" y="194" font-size="19" fill="#17263d">执行选定分支序列 → 历史</text><text x="700" y="221" font-size="19" fill="#17263d">H。输入是控制流，不是秘密数据或新函数指针。</text><path d="M320 280V343H420V385" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M960 280V343H860V385" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><text x="760" y="326" font-size="16" fill="#b65314">域切换；历史仍可能影响选择</text><rect x="190" y="397" width="900" height="155" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="210" y="430" font-size="21" fill="#2459bf" font-weight="700">受害者间接分支 J：call fp</text><text x="210" y="475" font-size="19" fill="#17263d">fp = handlers[id] = NORMAL。概念式：预测目标 = Predict(J, H, mode,</text><text x="210" y="502" font-size="19" fill="#17263d">已学习状态)。历史影响选择；fp 仍为 NORMAL。</text><path d="M420 552V594H320V625" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M860 552V594H960V625" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><rect x="40" y="637" width="560" height="145" rx="16" fill="#eef3ff" stroke="#d6e0ef"/><text x="60" y="670" font-size="21" fill="#2459bf" font-weight="700">对照历史 H_A → 预测 NORMAL</text><text x="60" y="715" font-size="19" fill="#17263d">保持 J、fp 和目标状态不变，预测命中正确目标。</text><rect x="680" y="637" width="560" height="145" rx="16" fill="#fff1e5" stroke="#d6e0ef"/><text x="700" y="670" font-size="21" fill="#b65314" font-weight="700">匹配历史 H_G → 预测 G</text><text x="700" y="715" font-size="19" fill="#17263d">可能选中允许域内已学习的 G 项；G 瞬态执行，之后恢复到</text><text x="700" y="742" font-size="19" fill="#17263d">NORMAL。</text><text x="40" y="826" font-size="21" fill="#17263d" font-weight="700">候选目标 ≠ if 条件；历史 ≠ fp；eIBRS 的目标模式隔离 ≠ 历史隔离。</text><text x="40" y="866" font-size="19" fill="#53677d">H_A / H_G 是标签，不是可写入的 BHB 比特串。真实匹配取决于具体 CPU 上下文及途中分支；仍须有泄漏 gadget 和观察通道。</text></g></svg>