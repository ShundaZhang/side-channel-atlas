<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">TAA / annotated code walkthrough</title><desc id="desc">Transaction rollback can preserve architectural correctness while a pending abort opens a buffer-sampling window. Semantic pseudocode / not an executable PoC committed counter = 5 Initial architectural state transaction: tentative counter = 6 Tentative write is not committed event: asynchronous_abort_pending Not a synchronous XABORT recipe transient: t = buffer_sample(0x42) Affected window may sample a buffer architectural: abort; counter = 5 Transaction writes are rolled back observe_trace(t)  // separate step Sample is not a transaction result</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">MECHANISM / CODE WALKTHROUGH</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">TAA</text><text x="40" y="116" font-size="21" fill="#53677d">Transaction rollback can preserve architectural correctness while a pending abort opens a</text><text x="40" y="142" font-size="21" fill="#53677d">buffer-sampling window.</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">What starts it?</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">Correct outcome vs affected behavior</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">Source of data / prediction</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">TSX asynchronous</text><text x="73" y="289" font-size="22" fill="#17263d" font-weight="700">abort pending</text><text x="73" y="362" font-size="18" fill="#53677d">TSX transaction has</text><text x="73" y="387" font-size="18" fill="#53677d">tentative writes; an</text><text x="73" y="412" font-size="18" fill="#53677d">asynchronous abort is</text><text x="73" y="437" font-size="18" fill="#53677d">pending.</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">Architectural outcome</text><text x="456" y="288" font-size="21" fill="#2459bf">Abort transaction; roll back its</text><text x="456" y="314" font-size="21" fill="#2459bf">writes</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">Affected transient behavior</text><text x="456" y="424" font-size="21" fill="#b65314">Load consumes an unrelated sample</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="990" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><rect x="1027" y="251" width="34" height="40" rx="6" fill="#ffe0bb" stroke="#b65314" /><text x="1032" y="277" font-size="15" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">42</text><rect x="1069" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1074" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><rect x="1111" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1116" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><rect x="1153" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1158" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><text x="986" y="328" font-size="20" fill="#b65314" font-weight="700">Internal buffer</text><text x="986" y="354" font-size="20" fill="#b65314" font-weight="700">sample</text><text x="986" y="402" font-size="17" fill="#53677d">Victim need not use</text><text x="986" y="424" font-size="17" fill="#53677d">TSX</text><rect x="30" y="528" width="1220" height="411" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="561" font-size="20" fill="#2459bf" font-weight="700">KEY CODE / Follow the highlighted line through the diagram</text><text x="55" y="590" font-size="17" fill="#53677d">Semantic pseudocode / not an executable PoC</text><rect x="54" y="606" width="1172" height="280" rx="14" fill="#f4f7fb" stroke="none" /><path d="M755 618V875" stroke="#d5deeb"/><text x="73" y="638" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">01</text><text x="115" y="638" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">committed counter = 5</text><text x="775" y="633" font-size="18" fill="#53677d">Initial architectural state</text><text x="73" y="684" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">02</text><text x="115" y="684" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transaction: tentative counter = 6</text><text x="775" y="679" font-size="18" fill="#53677d">Tentative write is not committed</text><rect x="61" y="706" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="730" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">03</text><text x="115" y="730" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">event: asynchronous_abort_pending</text><text x="775" y="725" font-size="18" fill="#b65314" font-weight="700">Not a synchronous XABORT recipe</text><rect x="61" y="752" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="776" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">04</text><text x="115" y="776" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transient: t = buffer_sample(0x42)</text><text x="775" y="771" font-size="18" fill="#b65314" font-weight="700">Affected window may sample a buffer</text><text x="73" y="822" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">05</text><text x="115" y="822" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">architectural: abort; counter = 5</text><text x="775" y="817" font-size="18" fill="#53677d">Transaction writes are rolled back</text><text x="73" y="868" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">06</text><text x="115" y="868" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">observe_trace(t)  // separate step</text><text x="775" y="863" font-size="18" fill="#53677d">Sample is not a transaction result</text><text x="55" y="910" font-size="17" fill="#53677d">Fragment only: setup, trigger machinery and receiver are omitted; not a hardware reproduction.</text><text x="55" y="931" font-size="14" fill="#53677d">Semantic model: labels / values are illustrative, not real internal APIs.</text><path d="M40 971H78" stroke="#2459bf" stroke-width="3"/><text x="91" y="977" font-size="17" fill="#53677d">Correct semantics</text><path d="M310 971H348" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="977" font-size="17" fill="#53677d">Affected path</text><text x="650" y="977" font-size="17" fill="#53677d">Transient result discarded; a trace may remain</text></g></svg>