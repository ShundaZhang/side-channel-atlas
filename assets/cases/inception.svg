<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">Inception / SRSO / annotated code walkthrough</title><desc id="desc">Speculation can train later return predictions, so recovering from one wrong path does not remove the predictor state it created. Semantic pseudocode / not an executable PoC real_return = R_OK Architectural return remains intact event: affected_phantom_speculation Abstract event; not a trigger recipe transient_activity -&gt; predictor_state Prediction state can be influenced later_RET: predict GADGET Later branch uses altered prediction transient: execute(GADGET) Transient result is discarded architectural: return_to(R_OK) Recovery need not erase prediction</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">MECHANISM / CODE WALKTHROUGH</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">Inception / SRSO</text><text x="40" y="116" font-size="21" fill="#53677d">Speculation can train later return predictions, so recovering from one wrong path does not</text><text x="40" y="142" font-size="21" fill="#53677d">remove the predictor state it created.</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">What starts it?</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">Correct outcome vs affected behavior</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">Source of data / prediction</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">Phantom speculation</text><text x="73" y="289" font-size="22" fill="#17263d" font-weight="700">and return</text><text x="73" y="315" font-size="22" fill="#17263d" font-weight="700">prediction</text><text x="73" y="362" font-size="18" fill="#53677d">One speculative window</text><text x="73" y="387" font-size="18" fill="#53677d">can affect a later RET</text><text x="73" y="412" font-size="18" fill="#53677d">through predictor</text><text x="73" y="437" font-size="18" fill="#53677d">state.</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">Architectural outcome</text><text x="456" y="288" font-size="21" fill="#2459bf">Real return address remains R_OK</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">Affected transient behavior</text><text x="456" y="424" font-size="21" fill="#b65314">Later RET may go to a wrong gadget</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="246" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="270" font-size="16" fill="#2459bf" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Phantom window</text><rect x="985" y="293" width="228" height="36" rx="14" fill="#e9f0ff" stroke="none" /><text x="997" y="317" 