<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">MDS / 代码图解</title><desc id="desc">瞬态样本可能来自 CPU 内部缓冲区，而非读取指令请求的地址。 语义伪代码 / 不是可执行 PoC expected_LOAD(A) = 0x17 请求地址本来有自己的正确值 other_work -&gt; buffer(0x6D) 无关数据经过 CPU 内部缓冲区 LOAD(A) encounters fault_or_assist 需要受影响条件，并非任意读取 transient: t = 0x6D; dependent_use(t) 样本可能与 A 无关 architectural: retry_correctly_or_fault 样本不成为该读取的正式结果 repeat(A): sample may change 这是采样，不是按指定地址读出</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2459bf"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65314"/></marker></defs><rect width="1280" height="1000" fill="#f5f7fc"/><g font-family="system-ui, sans-serif"><text x="40" y="34" font-size="17" fill="#2459bf" font-weight="700">机制 / 代码图解</text><text x="40" y="80" font-size="34" fill="#17263d" font-weight="700">MDS</text><text x="40" y="116" font-size="21" fill="#53677d">瞬态样本可能来自 CPU 内部缓冲区，而非读取指令请求的地址。</text><rect x="30" y="174" width="1220" height="334" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="208" font-size="17" fill="#53677d" font-weight="700">从什么事件开始？</text><text x="445" y="208" font-size="17" fill="#53677d" font-weight="700">正确结果与受影响行为</text><text x="975" y="208" font-size="17" fill="#53677d" font-weight="700">数据 / 预测从哪里来</text><rect x="54" y="230" width="288" height="245" rx="14" fill="#f1f5fa" stroke="none" /><text x="73" y="263" font-size="22" fill="#17263d" font-weight="700">读取遇到故障或内部辅助</text><text x="73" y="289" font-size="22" fill="#17263d" font-weight="700">处理</text><text x="73" y="362" font-size="18" fill="#53677d">LOAD(A) 本应得到</text><text x="73" y="387" font-size="18" fill="#53677d">0x17；其他工作使缓冲区经过</text><text x="73" y="412" font-size="18" fill="#53677d">0x6D。</text><rect x="438" y="230" width="494" height="105" rx="14" fill="#eaf1ff" stroke="none" /><text x="456" y="257" font-size="17" fill="#2459bf" font-weight="700">正式结果</text><text x="456" y="288" font-size="21" fill="#2459bf">重试得到正确值，或报告故障</text><rect x="438" y="365" width="494" height="110" rx="14" fill="#fff1e6" stroke="none" /><text x="456" y="392" font-size="17" fill="#b65314" font-weight="700">受影响的瞬态行为</text><text x="456" y="424" font-size="21" fill="#b65314">短暂消费无关缓冲区样本</text><path d="M342 330H366L403 283H426" fill="none" stroke="#2459bf" stroke-width="3" marker-end="url(#blue)"/><path d="M366 330L403 420H426" fill="none" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange)"/><circle cx="366" cy="330" r="5" fill="white" stroke="#6c839c" stroke-width="2"/><path d="M954 224V479" stroke="#e1e8f0"/><rect x="970" y="230" width="258" height="245" rx="14" fill="#f4f7fb" stroke="none" /><rect x="985" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="990" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><rect x="1027" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1032" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">17</text><rect x="1069" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1074" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><rect x="1111" y="251" width="34" height="40" rx="6" fill="#ffe0bb" stroke="#b65314" /><text x="1116" y="277" font-size="15" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">6D</text><rect x="1153" y="251" width="34" height="40" rx="6" fill="#fff" stroke="#cddaea" /><text x="1158" y="277" font-size="15" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">…</text><text x="986" y="328" font-size="20" fill="#b65314" font-weight="700">填充 /</text><text x="986" y="354" font-size="20" fill="#b65314" font-weight="700">存储缓冲区或加载端口</text><text x="986" y="402" font-size="17" fill="#53677d">样本不由请求地址 A</text><text x="986" y="424" font-size="17" fill="#53677d">精确选择</text><rect x="30" y="528" width="1220" height="411" rx="22" fill="#fff" stroke="#d6e0ef" /><text x="55" y="561" font-size="20" fill="#2459bf" font-weight="700">主要代码 / 对照上图，跟踪高亮行的行为</text><text x="55" y="590" font-size="17" fill="#53677d">语义伪代码 / 不是可执行 PoC</text><rect x="54" y="606" width="1172" height="280" rx="14" fill="#f4f7fb" stroke="none" /><path d="M755 618V875" stroke="#d5deeb"/><text x="73" y="638" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">01</text><text x="115" y="638" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">expected_LOAD(A) = 0x17</text><text x="775" y="633" font-size="18" fill="#53677d">请求地址本来有自己的正确值</text><text x="73" y="684" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">02</text><text x="115" y="684" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">other_work -&gt; buffer(0x6D)</text><text x="775" y="679" font-size="18" fill="#53677d">无关数据经过 CPU 内部缓冲区</text><rect x="61" y="706" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="730" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">03</text><text x="115" y="730" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">LOAD(A) encounters fault_or_assist</text><text x="775" y="725" font-size="18" fill="#b65314" font-weight="700">需要受影响条件，并非任意读取</text><rect x="61" y="752" width="1158" height="41" rx="6" fill="#fff0e0" stroke="none" class="code-highlight"/><text x="73" y="776" font-size="17" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">04</text><text x="115" y="776" font-size="18" fill="#b65314" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">transient: t = 0x6D; dependent_use(t)</text><text x="775" y="771" font-size="18" fill="#b65314" font-weight="700">样本可能与 A 无关</text><text x="73" y="822" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">05</text><text x="115" y="822" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">architectural: retry_correctly_or_fault</text><text x="775" y="817" font-size="18" fill="#53677d">样本不成为该读取的正式结果</text><text x="73" y="868" font-size="17" fill="#53677d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">06</text><text x="115" y="868" font-size="18" fill="#17263d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" class="code-line">repeat(A): sample may change</text><text x="775" y="863" font-size="18" fill="#53677d">这是采样，不是按指定地址读出</text><text x="55" y="910" font-size="17" fill="#53677d">仅保留关键片段：省略环境、触发机制和接收端；不代表已在硬件上复现。</text><text x="55" y="931" font-size="14" fill="#53677d">语义模型：标签 / 数值用于讲解，不代表真实内部 API。</text><path d="M40 971H78" stroke="#2459bf" stroke-width="3"/><text x="91" y="977" font-size="17" fill="#53677d">正确语义</text><path d="M310 971H348" stroke="#b65314" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="977" font-size="17" fill="#53677d">受影响路径</text><text x="650" y="977" font-size="17" fill="#53677d">瞬态结果被取消，但痕迹可能保留</text></g></svg>